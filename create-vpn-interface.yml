---
- name: Criar Interface de VPN no Panorama
  hosts: all
  connection: local
  gather_facts: false


  vars:
    device:
       ip_address: "{{ ansible_host }}"
       username: "{{ ansible_user }}"
       password: "{{ ansible_password }}"  
  
  tasks:
    - name: Criar Zona para o Peer Remoto
      paloaltonetworks.panos.panos_zone:
        provider: '{{ device }}'
        zone: '{{ vpn_zone_name }}'
        template: "{{ panorama_template }}"
        mode: 'layer3'
    
    - name: Criar Tunnel Interface
      paloaltonetworks.panos.panos_tunnel:
        provider: '{{ device }}'
        if_name: "{{ vpn_interface_name }}"  # Ex: tunnel.10
        ip: "{{ vpn_tunnel_ip }}"    # Ex: 10.0.0.1/30
        template: "{{ panorama_template }}"  # O Template onde a VPN vai morar
        zone_name: '{{ vpn_zone_name }}'
        vr_name: 'default'
        state: 'present'
      register: tunnel_result

    - name: Create route 'Test-One'
      paloaltonetworks.panos.panos_static_route:
        provider: '{{ device }}'
        name: 'Test-One'
        destination: '1.1.1.0/24'
        interface: "{{ vpn_interface_name }}"
  
    - name: Resultado da Criação
      ansible.builtin.debug:
        msg: "Interface {{ vpn_interface_name }} criada no Template {{ panorama_template }}"